<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভূমি সেবা - গ্রাহক মতামত ও রিভিউ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 650px;
      margin: 20px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: #27ae60;
      outline: none;
    }
    button {
      width: 100%;
      padding: 13px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #219150;
    }
    .reviews-section {
      margin-top: 40px;
      border-top: 2px solid #eee;
      padding-top: 20px;
    }
    .reviews-section h3 {
      color: #2c3e50;
      margin-bottom: 15px;
    }
    .review-card {
      background: #f9f9f9;
      border-left: 4px solid #27ae60;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 8px;
    }
    .rating-stars {
      color: #f39c12;
      letter-spacing: 2px;
    }
    .review-comment {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    #loading {
      text-align: center;
      color: #777;
      font-style: italic;
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>আপনার মতামত বা রিভিউ দিন</h2>
  
  <!-- ব্যাকগ্রাউন্ডে গুগল ফর্ম জমা হওয়ার জন্য অদৃশ্য আইফ্রেম -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {onFormSubmitted();}"></iframe>
  
  <!-- গুগল ফর্ম সাবমিশন লিঙ্ক -->
  <form action="https://docs.google.com/forms/d/e/1FAIpQLSem6w36UTMHSR97ktIT1x7q-sp1qvzU0eF88Xq7AYkGsaVm2A/formResponse" method="POST" target="hidden_iframe" id="reviewForm">
    
    <!-- নাম -->
    <div class="form-group">
      <label for="name">আপনার নাম:</label>
      <input type="text" name="entry.400078048" id="name" placeholder="আপনার নাম লিখুন" required>
    </div>
    
    <!-- রেটিং -->
    <div class="form-group">
      <label for="rating">রেটিং (১-৫):</label>
      <select name="entry.1039370306" id="rating" required>
        <option value="5">⭐⭐⭐⭐⭐ (৫/৫ - চমৎকার)</option>
        <option value="4">⭐⭐⭐⭐ (৪/৫ - ভালো)</option>
        <option value="3">⭐⭐⭐ (৩/৫ - মাঝারি)</option>
        <option value="2">⭐⭐ (২/৫ - খারাপ)</option>
        <option value="1">⭐ (১/৫ - খুবই খারাপ)</option>
      </select>
    </div>
    
    <!-- মন্তব্য -->
    <div class="form-group">
      <label for="comment">মন্তব্য:</label>
      <textarea name="entry.402049984" id="comment" rows="4" placeholder="আপনার অনুভূতি বা অভিজ্ঞতা সংক্ষেপে লিখুন..." required></textarea>
    </div>
    
    <button type="submit">রিভিউ জমা দিন</button>
  </form>

  <!-- রিভিউ তালিকা -->
  <div class="reviews-section">
    <h3>গ্রাহকদের সাম্প্রতিক মতামত:</h3>
    <div id="loading">রিভিউ লোড হচ্ছে...</div>
    <div id="reviewsContainer"></div>
  </div>
</div>

<script>
  let submitted = false;
  
  document.getElementById('reviewForm').addEventListener('submit', function() {
    submitted = true;
  });

  function onFormSubmitted() {
    alert('ধন্যবাদ! আপনার রিভিউটি সফলভাবে জমা হয়েছে।');
    document.getElementById('reviewForm').reset();
    submitted = false;
    // গুগল শিট আপডেট হতে ২ সেকেন্ড সময় দিয়ে তথ্য রিফ্রেশ করা
    setTimeout(fetchReviews, 2000);
  }

  // গুগল শিটের তথ্য সংগ্রহের লিঙ্ক
  const sheetId = '1Xqc1P7D8E_SyPYPYxO7OXpEmQg131TRgyS65MpoZgvI';
  const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

  function fetchReviews() {
    fetch(sheetUrl)
      .then(response => response.text())
      .then(data => {
        // JSON ডাটা ফরম্যাট করা
        const jsonString = data.substring(47, data.length - 2);
        const json = JSON.parse(jsonString);
        const rows = json.table.rows;
        
        const container = document.getElementById('reviewsContainer');
        const loading = document.getElementById('loading');
        loading.style.display = 'none';
        container.innerHTML = '';

        if (!rows || rows.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#888;">এখনো কোনো রিভিউ দেওয়া হয়নি। প্রথম রিভিউটি আপনিই দিন!</p>';
          return;
        }

        // নতুন রিভিউ সবার ওপরে দেখানোর জন্য উল্টো লুপ
        for (let i = rows.length - 1; i >= 0; i--) {
          const cells = rows[i].c;
          if (!cells) continue;
          
          // গুগল শিটের কলাম অনুযায়ী তথ্য সংগ্রহ (Col B: Rating, Col C: Comment, Col D: Name)
          const ratingVal = cells[1] ? cells[1].v : '5';
          const commentVal = cells[2] ? cells[2].v : '';
          const nameVal = cells[3] ? cells[3].v : 'বেনামী';

          const card = document.createElement('div');
          card.className = 'review-card';

          const starCount = parseInt(ratingVal) || 5;
          const stars = '⭐'.repeat(starCount);

          card.innerHTML = `
            <div class="review-header">
              <span>${escapeHtml(nameVal)}</span>
              <span class="rating-stars">${stars}</span>
            </div>
            <div class="review-comment">${escapeHtml(commentVal)}</div>
          `;
          container.appendChild(card);
        }
      })
      .catch(error => {
        console.error('Error fetching reviews:', error);
        document.getElementById('loading').innerText = 'রিভিউ লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে পেজটি রিফ্রেশ করুন।';
      });
  }

  // স্ক্রিপ্ট স্ক্রিপ্ট আক্রমণ (XSS) রোধ করতে সাহায্য করার ফাংশন
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // পেজ লোড হলেই রিভিউ নিয়ে আসা
  window.onload = fetchReviews;
</script>

</body>
</html>
